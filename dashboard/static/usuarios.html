<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/logo_vectus.png">
<title>Vectus SOC · Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B14; --surface:#0E1626; --surface-2:#141F33; --border:#1E2A3D;
  --accent:#22D3EE; --accent-2:#2DD4BF;
  --text:#E6EDF5; --text-muted:#7E8DA0; --text-dim:#4A5970;
  --ok:#22C55E; --warn:#F59E0B; --crit:#EF4444;
  --font-ui:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
}
/* ---------- Tema claro ---------- */
body.light{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EEF2F9; --border:#DBE2EE;
  --accent:#0891B2; --accent-2:#0D9488; --accent-dim:#06B6D4;
  --text:#0F1B2D; --text-muted:#5A6B82; --text-dim:#94A3B8;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);
  display:flex;min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.sidebar{width:228px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;height:100vh;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid var(--border)}
.brand img{width:34px;height:34px;border-radius:8px;object-fit:contain}
.brand .lf{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-weight:700;color:#04141A}
.brand-text{font-weight:700;font-size:15px}.brand-text span{color:var(--accent)}
.nav{flex:1;padding:14px 10px}
.nav-label{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.15em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--text-muted);text-decoration:none;font-size:13.5px;font-weight:500;
  transition:background .12s,color .12s;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:rgba(34,211,238,.1);color:var(--accent)}
.nav a .ico{width:18px;height:18px;display:grid;place-items:center;flex-shrink:0}
.nav a .ico svg{width:17px;height:17px}
.user-chip{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--accent);font-family:var(--font-mono)}
.user-meta{flex:1;min-width:0}.user-meta .nm{font-size:12.5px;font-weight:600}
.user-meta .rl{font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono)}
.logout{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:4px}
.logout:hover{color:var(--crit)}
.main{flex:1;margin-left:228px;padding:28px 32px}
.theme-btn-top{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);cursor:pointer;display:grid;
  place-items:center;transition:color .15s,border-color .15s,background .15s;padding:0}
.theme-btn-top:hover{color:var(--accent);border-color:var(--accent)}
.theme-btn-top svg{width:17px;height:17px;display:block}
.head-actions{display:flex;align-items:center;gap:12px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.page-head .sub{color:var(--text-muted);font-size:13.5px;margin-top:4px}
.btn{background:var(--accent);color:#04141A;border:none;border-radius:9px;padding:10px 16px;
  font-weight:600;font-size:13px;cursor:pointer;transition:background .15s}
.btn:hover{background:#3DDDF0}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);padding:13px 20px;border-bottom:1px solid var(--border);font-weight:500}
td{padding:14px 20px;font-size:13px;border-bottom:1px solid rgba(30,42,61,.5)}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--font-mono);font-size:12.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11.5px;font-weight:600;font-family:var(--font-mono)}
.pill-admin{background:rgba(34,211,238,.12);color:var(--accent)}
.pill-viewer{background:var(--surface-2);color:var(--text-muted)}
.pill-on{background:rgba(34,197,94,.12);color:#86EFAC}
.pill-off{background:rgba(239,68,68,.12);color:#FCA5A5}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
  border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;transition:color .12s}
.icon-btn:hover{color:var(--text)}
.icon-btn.danger:hover{color:var(--crit)}
.msg{margin:16px 0;padding:11px 14px;border-radius:8px;font-size:13px;display:none;font-family:var(--font-mono)}
.msg.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#FCA5A5}
.msg.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86EFAC}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,.6);backdrop-filter:blur(2px);
  z-index:50;display:none;place-items:center}
.overlay.open{display:grid}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:28px;width:100%;max-width:420px}
.modal h3{font-size:17px;font-weight:600;margin-bottom:18px}
.modal label{display:block;font-size:12px;color:var(--text-muted);margin:14px 0 6px;font-weight:500}
.modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;padding:11px 13px;color:var(--text);font-size:13.5px;font-family:var(--font-mono)}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1}
.loading{padding:40px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:12.5px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="/static/logo_vectus.png" alt="V" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="lf" style="display:none">V</div>
    <div class="brand-text">Vectus <span>SOC</span></div>
  </div>
  <nav class="nav">
    <div class="nav-label">Operación</div>
    <a href="/dashboard"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span> Dashboard</a>
    <div class="nav-label">Administración</div>
    <a class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Usuarios</a>
  </nav>
  <div class="user-chip">
    <div class="avatar" id="avatar">··</div>
    <div class="user-meta"><div class="nm" id="u-name">—</div><div class="rl" id="u-role">—</div></div>
    <button class="logout" id="logout" title="Salir">⏻</button>
  </div>
</aside>

<main class="main">
  <div class="page-head">
    <div>
      <h1>Gestión de usuarios</h1>
      <div class="sub">Quién accede al panel. El acceso es por código de un solo uso al email.</div>
    </div>
    <div class="head-actions">
      <button class="theme-btn-top" id="theme-btn" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema"></button>
      <button class="btn" id="btn-new">+ Nuevo usuario</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="panel">
    <div id="tbl"><div class="loading">Cargando usuarios…</div></div>
  </div>
</main>

<!-- Modal nuevo/editar -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Nuevo usuario</h3>
    <input type="hidden" id="m-id">
    <label>Email</label>
    <input id="m-email" type="email" placeholder="persona@vectus.la">
    <label>Nombre</label>
    <input id="m-name" type="text" placeholder="Nombre y apellido">
    <label>Rol</label>
    <select id="m-role">
      <option value="viewer">Viewer — solo lectura</option>
      <option value="admin">Admin — gestiona usuarios</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel">Cancelar</button>
      <button class="btn" id="m-save">Guardar</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let me = null;

async function guard(r){ if(r.status===401){ window.location.href="/login"; throw new Error("401"); } return r; }
function showMsg(t,k){ const m=$("#msg"); m.textContent=t; m.className="msg "+k; setTimeout(()=>m.className="msg",4000); }
function esc(s){ return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function loadMe(){
  const r = await guard(await fetch("/auth/me")); me = await r.json();
  $("#u-name").textContent = me.name||me.email; $("#u-role").textContent = me.role;
  $("#avatar").textContent = (me.name||me.email).trim().slice(0,2).toUpperCase();
  if(me.role!=="admin"){ window.location.href="/dashboard"; }
}

async function loadUsers(){
  const r = await guard(await fetch("/api/users")); const d = await r.json();
  if(!d.ok){ $("#tbl").innerHTML=`<div class="loading">Sin permiso</div>`; return; }
  let h = `<table><thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Estado</th>
    <th>Último acceso</th><th style="text-align:right">Acciones</th></tr></thead><tbody>`;
  for(const u of d.users){
    h += `<tr>
      <td class="mono">${esc(u.email)}</td>
      <td>${esc(u.name)||"—"}</td>
      <td><span class="pill pill-${u.role}">${u.role}</span></td>
      <td><span class="pill ${u.active?'pill-on':'pill-off'}">${u.active?'activo':'inactivo'}</span></td>
      <td class="mono" style="color:var(--text-muted)">${u.last_login?fmtDate(u.last_login):'nunca'}</td>
      <td><div class="row-actions">
        <button class="icon-btn" onclick='editUser(${JSON.stringify(u)})'>Editar</button>
        <button class="icon-btn" onclick='toggleUser(${u.id},${u.active?0:1})'>${u.active?'Desactivar':'Activar'}</button>
        <button class="icon-btn danger" onclick='delUser(${u.id},"${esc(u.email)}")'>Eliminar</button>
      </div></td>
    </tr>`;
  }
  h += `</tbody></table>`;
  $("#tbl").innerHTML = h;
}
function fmtDate(s){ try{ return new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return s; } }

// Modal
function openModal(title){ $("#modal-title").textContent=title; $("#overlay").classList.add("open"); }
function closeModal(){ $("#overlay").classList.remove("open"); }
$("#m-cancel").addEventListener("click", closeModal);
$("#btn-new").addEventListener("click", ()=>{
  $("#m-id").value=""; $("#m-email").value=""; $("#m-name").value=""; $("#m-role").value="viewer";
  $("#m-email").disabled=false; openModal("Nuevo usuario");
});
window.editUser = (u)=>{
  $("#m-id").value=u.id; $("#m-email").value=u.email; $("#m-email").disabled=true;
  $("#m-name").value=u.name||""; $("#m-role").value=u.role; openModal("Editar usuario");
};
$("#m-save").addEventListener("click", async ()=>{
  const id=$("#m-id").value, email=$("#m-email").value.trim(),
        name=$("#m-name").value.trim(), role=$("#m-role").value;
  try{
    let r;
    if(id){ r = await fetch(`/api/users/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,role})}); }
    else{ if(!email||!email.includes("@")){ showMsg("Email inválido","err"); return; }
      r = await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,name,role})}); }
    const d = await r.json();
    if(d.ok){ closeModal(); showMsg("Guardado","ok"); loadUsers(); }
    else showMsg(d.error||"Error","err");
  }catch(e){ showMsg("Error de conexión","err"); }
});
window.toggleUser = async (id,active)=>{
  const r = await fetch(`/api/users/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({active:!!active})});
  const d = await r.json();
  if(d.ok){ showMsg("Actualizado","ok"); loadUsers(); } else showMsg(d.error||"Error","err");
};
window.delUser = async (id,email)=>{
  if(!confirm(`¿Eliminar a ${email}? Esta acción no se puede deshacer.`)) return;
  const r = await fetch(`/api/users/${id}`,{method:"DELETE"});
  const d = await r.json();
  if(d.ok){ showMsg("Usuario eliminado","ok"); loadUsers(); } else showMsg(d.error||"Error","err");
};
$("#logout").addEventListener("click", async ()=>{ await fetch("/auth/logout",{method:"POST"}); window.location.href="/login"; });

(async()=>{ try{ await loadMe(); await loadUsers(); }catch(e){} })();

// ---------- Tema claro/oscuro ----------
(function(){
  const saved = localStorage.getItem("vectus-theme") || "dark";
  if(saved === "light") document.body.classList.add("light");
})();
function toggleTheme(){
  document.body.classList.toggle("light");
  const isLight = document.body.classList.contains("light");
  localStorage.setItem("vectus-theme", isLight ? "light" : "dark");
  paintThemeBtn();
}
function paintThemeBtn(){
  const btn = document.getElementById("theme-btn");
  if(!btn) return;
  const light = document.body.classList.contains("light");
  btn.innerHTML = light
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
}
paintThemeBtn();

</script>
</body>
</html>
